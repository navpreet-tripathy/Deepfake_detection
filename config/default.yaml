# ============================================================
# ODD²F — Configuration
# ============================================================
# All hyper-parameters and paths in one place.
# Override via CLI args or environment variables.
# ============================================================

# --- Paths ---
data:
  # Each entry is a dataset with a root dir containing real/ and fake/ subfolders.
  datasets:
    - name: "140k_faces"
      root: "path/to/140k_real_fake_faces"
    - name: "cifake"
      root: "path/to/cifake"
    - name: "celeb_df"
      root: "path/to/celeb_df"
  # Validation / Test split ratios
  val_ratio: 0.15
  test_ratio: 0.15

# --- Model ---
model:
  backbone: "mobilenetv3_large_100"   # timm model name
  pretrained: true
  feature_dim: 960                     # MobileNetV3-Large penultimate features
  cbam_reduction: 16                   # CBAM channel reduction ratio
  cbam_kernel_size: 7                  # CBAM spatial conv kernel
  fusion_dim: 512
  classifier_hidden: 256
  dropout: 0.3
  num_classes: 2

# --- ELA ---
ela:
  quality: 95                          # JPEG re-save quality
  scale: 20                            # Amplification factor for visualization

# --- Augmentation ---
augmentation:
  enabled: true
  horizontal_flip_p: 0.5
  rotation_limit: 15
  random_crop_scale: [0.8, 1.0]
  color_jitter:
    brightness: 0.2
    contrast: 0.2
    saturation: 0.2
    hue: 0.1
  gaussian_blur_p: 0.1
  gaussian_blur_limit: [3, 7]
  cutmix:
    enabled: true
    alpha: 1.0
    p: 0.5

# --- Training ---
training:
  epochs: 50
  batch_size: 32
  num_workers: 4
  learning_rate: 1.0e-3
  weight_decay: 1.0e-5
  optimizer: "adam"
  scheduler: "cosine"                  # cosine annealing
  warmup_epochs: 3
  early_stopping:
    enabled: true
    patience: 7
    min_delta: 0.001
  mixed_precision: true                # AMP for faster training
  gradient_clip_max_norm: 1.0
  seed: 42

# --- Evaluation ---
evaluation:
  robustness_tests:
    jpeg_qualities: [70, 50, 30]
    rotation_degrees: [5, 10, 15, 20]
    scale_factors: [0.5, 0.75, 1.25, 1.5]
    gaussian_noise_std: [0.01, 0.02, 0.05]
    brightness_shifts: [-0.2, -0.1, 0.1, 0.2]

# --- Export ---
export:
  onnx: true
  tflite: true
  input_size: [1, 3, 224, 224]

# --- Logging ---
logging:
  save_dir: "runs"
  log_interval: 50                     # steps between log prints
  save_best_only: true
  tensorboard: true
